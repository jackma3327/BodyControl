name: Generate Keystore

# 一次性：生成固定签名 keystore 并提交到仓库，之后所有构建共用同一签名，
# 使得新版 APK 可直接覆盖安装（无需卸载），数据不丢失。
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate keystore if absent
        run: |
          if [ -f keystore/bodycontrol.jks ]; then
            echo "keystore already exists, skipping"
            exit 0
          fi
          mkdir -p keystore
          keytool -genkeypair -v \
            -keystore keystore/bodycontrol.jks \
            -storepass bodycontrol -keypass bodycontrol \
            -alias bodycontrol \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=BodyControl, OU=Personal, O=BodyControl, L=City, ST=State, C=CN"

      - name: Commit keystore
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f keystore/bodycontrol.jks
          git commit -m "Add stable signing keystore for consistent APK signature" || {
            echo "nothing to commit"; exit 0;
          }
          git push
