name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 若已配置 SIGNING_KEYSTORE_BASE64 Secret，则解码出固定签名 keystore；
      # 未配置时跳过，构建回退到默认 debug 签名（仍可成功）。
      - name: Decode signing keystore
        id: keystore
        env:
          KS_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "No SIGNING_KEYSTORE_BASE64 secret; using default debug signing."
            echo "path=" >> "$GITHUB_OUTPUT"
          else
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/bodycontrol.jks"
            echo "path=$RUNNER_TEMP/bodycontrol.jks" >> "$GITHUB_OUTPUT"
          fi

      - name: Build debug APK
        env:
          SIGNING_STORE_FILE: ${{ steps.keystore.outputs.path }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BodyControl-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
